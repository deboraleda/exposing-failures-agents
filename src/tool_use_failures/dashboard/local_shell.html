<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corrupt Success in Tool-Calling Agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Design tokens used by index.html */
  :root {
    --color-bg: #ffffff; --color-panel: #ffffff; --color-subtle: #f5f6f8;
    --color-fg: #14161b; --color-fg-muted: #5d6470; --color-border-line: #e4e7ec;
    --color-accent: #4338ca;
    --color-ok: #16a34a; --color-bad: #dc2626; --color-warn: #d97706; --color-neutral: #64748b;
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #0e1014; --color-panel: #161920; --color-subtle: #1d2129;
      --color-fg: #e9ebef; --color-fg-muted: #9ba2ae; --color-border-line: #2a2f39;
      --color-accent: #8b93f8;
      --color-ok: #4ade80; --color-bad: #f87171; --color-warn: #fbbf24; --color-neutral: #94a3b8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #0e1014; --color-panel: #161920; --color-subtle: #1d2129;
    --color-fg: #e9ebef; --color-fg-muted: #9ba2ae; --color-border-line: #2a2f39;
    --color-accent: #8b93f8;
    --color-ok: #4ade80; --color-bad: #f87171; --color-warn: #fbbf24; --color-neutral: #94a3b8;
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; padding: 40px 24px 64px; background: var(--color-bg); color: var(--color-fg); -webkit-font-smoothing: antialiased; }
  .theme-switch { position: absolute; top: 40px; right: max(24px, calc((100vw - 1180px) / 2)); display: flex; gap: 8px; align-items: center; font: 500 12.5px var(--font-sans); color: var(--color-fg-muted); }
  @media (max-width: 720px) { body { padding: 20px 16px 48px; } .theme-switch { position: static; justify-content: flex-end; margin-bottom: 12px; } }
</style>
<script>
  // Minimal local replacement of the claude.ai dash runtime, with the data inlined.
  const DATA = /*__DATA__*/;
  window.dash = (() => {
    const calcs = {};
    const draws = [];
    const params = { cm_agent: 'all', cm_model: 'all' };
    const cache = {};
    const data = (id) => {
      if (cache[id]) return cache[id];
      if (id in DATA) return (cache[id] = { status: 'ok', data: DATA[id] });
      const c = calcs[id];
      if (!c) return { status: 'missing', data: [] };
      return (cache[id] = { status: 'ok', data: c.fn(...c.inputs.map((i) => data(i).data)) });
    };
    const render = () => {
      for (const [name, fn] of draws) document.querySelectorAll(`[data-draw="${name}"]`).forEach((el) => fn(el));
    };
    return {
      calc: (id, opts) => { calcs[id] = opts; },
      draw: (name, fn) => { draws.push([name, fn]); },
      data,
      params: () => ({ ...params }),
      setParams: (p) => { Object.assign(params, p); render(); },
      render,
    };
  })();
</script>
</head>
<body>
<label class="theme-switch">Theme
  <select id="theme" class="dash-select" aria-label="Theme">
    <option value="auto">Automatic</option>
    <option value="light">Light (white)</option>
    <option value="dark">Dark</option>
  </select>
</label>
<script>
  (() => {
    const sel = document.getElementById('theme');
    const apply = (v) => {
      if (v === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', v);
    };
    let saved = 'auto';
    try { saved = localStorage.getItem('csx-theme') || 'auto'; } catch (e) {}
    sel.value = saved;
    apply(saved);
    sel.onchange = () => {
      apply(sel.value);
      try { localStorage.setItem('csx-theme', sel.value); } catch (e) {}
    };
  })();
</script>
<!--__BODY__-->
<script>dash.render();</script>
</body>
</html>
